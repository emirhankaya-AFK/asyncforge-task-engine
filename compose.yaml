services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asyncforge
      POSTGRES_USER: asyncforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyncforge -d asyncforge"]
      interval: 2s
      retries: 25
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://asyncforge:${POSTGRES_PASSWORD}@postgres:5432/asyncforge
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://asyncforge:${POSTGRES_PASSWORD}@postgres:5432/asyncforge
      ASYNCFORGE_API_KEY: ${ASYNCFORGE_API_KEY:?set API key}
      ASYNCFORGE_OPERATOR_KEY: ${ASYNCFORGE_OPERATOR_KEY:?set operator key}
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    command: ["asyncforge-worker", "--queue", "default"]
    environment:
      DATABASE_URL: postgresql+psycopg://asyncforge:${POSTGRES_PASSWORD}@postgres:5432/asyncforge
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
volumes:
  postgres_data:

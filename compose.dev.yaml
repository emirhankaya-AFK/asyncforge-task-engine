# Disposable, isolated PostgreSQL instances for tests and benchmark only.
# Do NOT replace with an existing production database or Neon URL.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asyncforge_test
      POSTGRES_USER: asyncforge
      POSTGRES_PASSWORD: local_test_only
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyncforge -d asyncforge_test"]
      interval: 2s
      retries: 25
  postgres-bench:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asyncforge_bench
      POSTGRES_USER: asyncforge
      POSTGRES_PASSWORD: local_bench_only
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyncforge -d asyncforge_bench"]
      interval: 2s
      retries: 25
